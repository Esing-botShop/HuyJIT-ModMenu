name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: git clone --recursive https://github.com/theos/theos

      - name: Setup iOS SDK
        run: |
          git clone https://github.com/theos/sdks

      - name: Compile Tweak
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # Устанавливаем утилиту для подписи файлов iOS
          brew install ldid
          make package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Menu-Dylib
          path: .theos/obj/debug/*.dylib
